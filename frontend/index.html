<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chirp — a tiny Twitter clone</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar-left">
        <a class="brand" href="#" aria-label="Chirp home">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" style="fill: #1d9bf0">
            <path d="M22 5.8c-.7.3-1.5.6-2.4.7.9-.5 1.5-1.3 1.8-2.3-.8.5-1.7.8-2.7 1A4.2 4.2 0 0 0 11.6 9c0 .3 0 .6.1.9A12 12 0 0 1 3 4.7a4.2 4.2 0 0 0 1.3 5.6 4 4 0 0 1-1.9-.5v.1a4.2 4.2 0 0 0 3.4 4.1 4 4 0 0 1-1.9.1 4.2 4.2 0 0 0 4 2.9A8.5 8.5 0 0 1 2 18.6a12 12 0 0 0 6.5 1.9c7.8 0 12-6.4 12-12v-.6c.8-.6 1.5-1.3 2-2.1z"/>
          </svg>
        </a>
        <nav class="nav">
          <a class="nav-item active" href="#"><span class="nav-ic">🏠</span><span>홈</span></a>
          <a class="nav-item" href="#"><span class="nav-ic">🔍</span><span>탐색</span></a>
          <a class="nav-item" href="#"><span class="nav-ic">🔔</span><span>알림</span></a>
          <a class="nav-item" href="#"><span class="nav-ic">✉️</span><span>쪽지</span></a>
          <a class="nav-item" href="#"><span class="nav-ic">🔖</span><span>북마크</span></a>
          <a class="nav-item" href="#"><span class="nav-ic">👤</span><span>프로필</span></a>
        </nav>
        <button class="btn btn-primary btn-tweet" id="open-compose">트윗하기</button>
        <div class="me">
          <img class="avatar" src="https://i.pravatar.cc/64?img=12" alt="" />
          <div class="me-text">
            <div class="me-name">나</div>
            <div class="me-handle">@me</div>
          </div>
        </div>
      </aside>

      <main class="feed">
        <header class="feed-head">
          <h2>홈</h2>
          <div class="tabs">
            <button class="tab active">추천</button>
            <button class="tab">팔로잉</button>
          </div>
        </header>

        <section class="compose">
          <img class="avatar" src="https://i.pravatar.cc/64?img=12" alt="" />
          <div class="compose-body">
            <textarea id="compose-text" placeholder="무슨 일이 일어나고 있나요?" rows="2"></textarea>
            <div class="compose-actions">
              <span class="compose-icons">📷 🎞️ 📊 😊 📍</span>
              <button class="btn btn-primary" id="submit-tweet">게시</button>
            </div>
          </div>
        </section>

        <ol id="feed-list" class="feed-list" aria-live="polite"></ol>
      </main>

      <aside class="sidebar-right">
        <div class="search">
          <input type="search" placeholder="검색" />
        </div>
        <div class="card">
          <h3>나를 위한 트렌드</h3>
          <ul class="trends">
            <li><span class="trend-meta">대한민국에서 트렌드 중</span><strong>#클로드코드</strong><span class="trend-meta">12.4K posts</span></li>
            <li><span class="trend-meta">기술 · 트렌드</span><strong>WebAssembly</strong><span class="trend-meta">8,210 posts</span></li>
            <li><span class="trend-meta">스포츠 · 트렌드</span><strong>손흥민</strong><span class="trend-meta">31.2K posts</span></li>
          </ul>
        </div>
        <div class="card">
          <h3>팔로우 추천</h3>
          <ul class="who">
            <li>
              <img class="avatar" src="https://i.pravatar.cc/64?img=32" alt="" />
              <div><div class="me-name">Lee Sang-hyun</div><div class="me-handle">@shlee</div></div>
              <button class="btn btn-dark">팔로우</button>
            </li>
            <li>
              <img class="avatar" src="https://i.pravatar.cc/64?img=47" alt="" />
              <div><div class="me-name">Park Ji-won</div><div class="me-handle">@jiwon_p</div></div>
              <button class="btn btn-dark">팔로우</button>
            </li>
          </ul>
        </div>
        <footer class="legal">
          © Chirp · 약관 · 개인정보 · 쿠키
        </footer>
      </aside>
    </div>

    <dialog id="compose-modal" class="modal">
      <form method="dialog" class="compose compose-modal">
        <img class="avatar" src="https://i.pravatar.cc/64?img=12" alt="" />
        <div class="compose-body">
          <textarea id="compose-modal-text" placeholder="무슨 일이 일어나고 있나요?" rows="4"></textarea>
          <div class="compose-actions">
            <button class="btn btn-ghost" value="cancel">취소</button>
            <button class="btn btn-primary" id="submit-tweet-modal" value="default">게시</button>
          </div>
        </div>
      </form>
    </dialog>

    <script src="js/data.js"></script>
    <script src="js/feed.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/compose.js"></script>
  </body>
</html>
